apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: production
spec:
  interval: 10m

  chart:
    spec:
      chart: n8n
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: flux-system

  install:
    disableWait: true
    remediation:
      retries: 3

  upgrade:
    disableWait: true
    remediation:
      retries: 3

  values:
    image:
      repository: n8nio/n8n
      tag: ""

    service:
      type: ClusterIP

    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: n8n.local
          paths:
            - path: /
              pathType: Prefix

    db:
      type: postgresdb

    externalPostgresql:
      host: n8n-db-rw
      port: 5432
      database: n8n
      username: n8n
      existingSecret: n8n-db-app

    externalRedis:
      host: n8n-redis-master
      port: 6379

    main:
      count: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 1Gi

    worker:
      mode: queue
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 5
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 80
          - type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: 80
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 2000m
          memory: 2Gi

    webhook:
      mode: queue
      url: "http://n8n.local"
      count: 1
